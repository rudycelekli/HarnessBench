name: Contribution validation
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  native-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src tests
      - run: python -m pytest -q
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build --wheel --sdist
      - name: Install built wheel and exercise packaged CLI
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install click
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/harness-bench" version
          "$RUNNER_TEMP/wheel-env/bin/harness-bench" harnesses
  stagehand-sdk-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Check actual pinned SDK import without model or browser calls
        run: |
          npm install --prefix "$RUNNER_TEMP/stagehand-sdk" @browserbasehq/stagehand@4.3.0
          cd "$RUNNER_TEMP/stagehand-sdk"
          node --input-type=module -e "import '@browserbasehq/stagehand'"
